<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="//cdn.muicss.com/mui-0.10.3/css/mui.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      html,
      body {
        height: 100%;
      }

      html,
      body,
      input,
      textarea,
      button {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.004);
      }

      /**
 * Header CSS
 */
      header {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 2;
      }

      header ul.mui-list--inline {
        margin-bottom: 0;
      }

      header a {
        color: white;
      }

      header table {
        width: 100%;
      }

      /**
 * Content CSS
 */
      #content-wrapper {
        min-height: 100%;

        /* sticky footer */
        box-sizing: border-box;
        margin-bottom: -100px;
        padding-bottom: 100px;
      }

      /**
 * Footer CSS
 */
      footer {
        box-sizing: border-box;
        height: 100px;
        background-color: #eee;
        border-top: 1px solid #e0e0e0;
        padding-top: 35px;
      }
    </style>
    <script src="//cdn.muicss.com/mui-0.10.3/js/mui.min.js"></script>
    <title>Material UI</title>
  </head>
  <body>
    <div class="mui-appbar">
      <table width="100%">
        <tr style="vertical-align: middle">
          <td class="mui--appbar-height">Home</td>
          <td class="mui--appbar-height" align="right">Body</td>
        </tr>
      </table>
    </div>
    <div id="content-wrapper" class="mui--text-center">
      <div class="mui--appbar-height"></div>
      <br />
      <br />
      <div class="mui--text-display3">Brand.io</div>
      <br />
      <br />
      <button class="mui-btn mui-btn--raised">Get started</button>
    </div>
    <div>
      <button class="mui-btn">Button</button>
      <button class="mui-btn mui-btn--primary">Button</button>
      <button class="mui-btn mui-btn--danger">Button</button>
      <button class="mui-btn mui-btn--accent">Button</button>
    </div>
    <div>
      <button class="mui-btn" disabled>Button</button>
      <button class="mui-btn mui-btn--primary" disabled>Button</button>
      <button class="mui-btn mui-btn--danger" disabled>Button</button>
      <button class="mui-btn mui-btn--accent" disabled>Button</button>
    </div>

    <footer>
      <div class="mui-container mui--text-center">
        Made with ♥ by <a href="https://www.muicss.com">MUICSS</a>
      </div>
    </footer>
  </body>
</html>
